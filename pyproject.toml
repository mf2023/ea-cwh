[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-cwh"
version = "0.20261001.3"
description = "Encre Agent plugin market central index — the catalog of published ea-plugin-* packages"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team"}]
keywords = ["encre", "plugin", "market", "catalog", "index"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
# Data-only wheel: the reader API is pure stdlib on purpose so the market
# backend can parse the index without dragging in any dependency.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_cwh*"]

[tool.setuptools.package-data]
"ea_cwh" = ["catalog.json", "py.typed"]
